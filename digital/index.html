<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Digital USTC · 序章 | 慢镜轮转 · 疾语序诗</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
        }

        body {
            background: #0a0c12;
            min-height: 100vh;
            overflow-x: hidden;
            font-family: 'Cambria', 'Georgia', 'Times New Roman', 'Palatino', 'Segoe UI', system-ui, monospace;
        }

        #bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: block;
            z-index: 0;
            pointer-events: none;
            opacity: 0.5;
        }

        #intro-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1000;
            overflow: hidden;
            font-family: 'Cambria', 'Courier New', 'Fira Code', monospace;
            transition: opacity 1.2s cubic-bezier(0.23, 1, 0.32, 1);
            will-change: opacity;
        }

        #background-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-size: cover;
            background-position: center 30%;
            background-repeat: no-repeat;
            filter: brightness(0.4) contrast(1.1) blur(1px);
            /* 图片缩放过渡加快1.5倍 (原8.6s → 5.733s) */
            transition: transform 5.733s ease-out;
            will-change: transform;
            z-index: 1;
        }

        #background-layer.zoom-effect {
            transform: scale(1.08);
        }

        /* 趣味特效: 故障纹理增强层 */
        #glitch-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: repeating-linear-gradient(
                0deg,
                rgba(0, 255, 255, 0.02) 0px,
                rgba(255, 0, 255, 0.02) 2px,
                transparent 2px,
                transparent 8px
            );
            pointer-events: none;
            z-index: 2;
            mix-blend-mode: overlay;
            animation: subtleGlitchShift 6s infinite linear;
        }

        @keyframes subtleGlitchShift {
            0% { opacity: 0.3; background-position: 0 0; }
            50% { opacity: 0.6; background-position: 0 2px; }
            100% { opacity: 0.3; background-position: 0 0; }
        }

        #overlay-dark {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at center, transparent 40%, #000000aa 90%);
            z-index: 3;
            pointer-events: none;
        }

        #scroll-wrapper {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            z-index: 10;
            pointer-events: none;
        }

        /* 主文本容器 */
        #scroll-text {
            position: relative;
            width: 80%;
            max-width: 1000px;
            margin: 0 auto;
            padding: 2.2rem 2rem;
            color: #eef5ff;
            font-size: 1.85rem;
            line-height: 2.6rem;
            font-weight: 460;
            text-shadow: 0 0 6px rgba(0, 200, 255, 0.4);
            letter-spacing: 0.02em;
            backdrop-filter: blur(4px);
            background: rgba(8, 12, 24, 0.45);
            border-left: 4px solid #7afcff;
            border-radius: 0 40px 40px 0;
            font-family: 'Cambria', 'Georgia', 'Times New Roman', 'Palatino', 'Segoe UI', monospace;
            transition: all 0.2s ease;
            animation: textBreathingGlow 3s infinite ease-in-out;
            box-shadow: 0 0 12px rgba(122, 252, 255, 0.2);
        }

        @keyframes textBreathingGlow {
            0% {
                text-shadow: 0 0 4px rgba(122, 252, 255, 0.3);
                box-shadow: 0 0 8px rgba(122, 252, 255, 0.2);
                background: rgba(8, 12, 24, 0.45);
            }
            50% {
                text-shadow: 0 0 12px rgba(122, 252, 255, 0.7);
                box-shadow: 0 0 22px rgba(122, 252, 255, 0.4);
                background: rgba(15, 20, 35, 0.55);
            }
            100% {
                text-shadow: 0 0 4px rgba(122, 252, 255, 0.3);
                box-shadow: 0 0 8px rgba(122, 252, 255, 0.2);
                background: rgba(8, 12, 24, 0.45);
            }
        }

        #scroll-text::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border-radius: 0 40px 40px 0;
            pointer-events: none;
            background: linear-gradient(
                120deg,
                transparent 0%,
                rgba(122, 252, 255, 0.25) 30%,
                rgba(0, 210, 255, 0.4) 50%,
                rgba(122, 252, 255, 0.25) 70%,
                transparent 100%
            );
            background-size: 200% 100%;
            animation: borderFlowingLight 4s infinite linear;
            mix-blend-mode: overlay;
        }

        @keyframes borderFlowingLight {
            0% {
                background-position: 100% 0;
            }
            100% {
                background-position: -100% 0;
            }
        }

        .story-line {
            margin-bottom: 1.1rem;
            opacity: 0.94;
            word-break: break-word;
            white-space: normal;
        }

        .story-space {
            height: 2rem;
        }

        /* SKIP 按钮 */
        #skip-btn {
            position: fixed;
            bottom: 32px;
            right: 32px;
            z-index: 200;
            background: rgba(20, 25, 45, 0.8);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(122, 252, 255, 0.6);
            color: #b3f0ff;
            font-family: 'Cambria', monospace;
            font-weight: 600;
            font-size: 1rem;
            letter-spacing: 2px;
            padding: 12px 26px;
            border-radius: 60px;
            cursor: pointer;
            transition: 0.25s ease;
            box-shadow: 0 0 12px rgba(0, 210, 255, 0.3);
            pointer-events: auto;
        }

        #skip-btn:hover {
            background: #7afcff22;
            border-color: #7afcff;
            color: #ffffff;
            box-shadow: 0 0 20px #7afcffaa;
            transform: scale(1.03);
        }

        .fade-out {
            opacity: 0 !important;
            visibility: visible;
            pointer-events: none;
        }

        #transition-panel {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 2000;
            display: flex;
            align-items: center;
            justify-content: center;
            background: radial-gradient(ellipse at 30% 40%, #03050b, #000000dd);
            backdrop-filter: blur(16px);
            opacity: 0;
            visibility: hidden;
            transition: opacity 1s ease, visibility 0s linear 1s;
            font-family: 'Cambria', 'Inter', system-ui;
        }

        #transition-panel.active {
            opacity: 1;
            visibility: visible;
            transition: opacity 0.9s cubic-bezier(0.2, 0.9, 0.3, 1.1), visibility 0s linear 0s;
        }

        .portal-card {
            text-align: center;
            max-width: 600px;
            padding: 2.8rem 2.4rem;
            background: rgba(12, 20, 32, 0.7);
            backdrop-filter: blur(20px);
            border-radius: 64px;
            border: 1px solid rgba(122, 252, 255, 0.6);
            box-shadow: 0 30px 40px -20px rgba(0, 0, 0, 0.6), 0 0 0 1px rgba(122, 252, 255, 0.1) inset;
            transform: translateY(20px);
            animation: floatUp 0.8s ease forwards;
        }

        @keyframes floatUp {
            to {
                transform: translateY(0);
                opacity: 1;
            }
            from {
                transform: translateY(30px);
                opacity: 0;
            }
        }

        .portal-card h1 {
            font-size: 3rem;
            font-weight: 600;
            background: linear-gradient(135deg, #ffffff, #7afcff, #a0e9ff);
            background-clip: text;
            -webkit-background-clip: text;
            color: transparent;
            letter-spacing: -0.5px;
            margin-bottom: 0.5rem;
        }

        .portal-card .sub {
            font-size: 1rem;
            color: #a0c4e8;
            letter-spacing: 2px;
            margin-bottom: 2rem;
            border-bottom: 1px dashed rgba(122, 252, 255, 0.4);
            display: inline-block;
            padding-bottom: 6px;
        }

        .portal-card p {
            color: #cfecff;
            font-size: 1.1rem;
            line-height: 1.6;
            margin: 1.6rem 0;
            font-weight: 300;
        }

        .enter-btn {
            background: linear-gradient(105deg, #7afcff22, #2f80ed33);
            border: 1.5px solid #7afcff;
            color: #e2f0ff;
            font-size: 1.3rem;
            font-weight: 600;
            padding: 14px 36px;
            border-radius: 60px;
            cursor: pointer;
            backdrop-filter: blur(8px);
            margin-top: 1rem;
            transition: 0.3s;
            display: inline-flex;
            align-items: center;
            gap: 12px;
            font-family: 'Cambria', monospace;
            letter-spacing: 1px;
        }

        .enter-btn:hover {
            background: #7afcffcc;
            border-color: #ffffff;
            color: #0a0f1a;
            box-shadow: 0 0 28px #7afcffaa;
            transform: scale(1.02);
        }

        /* ========= 鼠标光效 - 彻底解决遮挡问题 ========= */
        .mouse-glow {
            position: fixed;
            top: 0;
            left: 0;
            width: 460px;
            height: 460px;
            background: radial-gradient(circle, rgba(122, 252, 255, 0.45) 0%, rgba(0, 210, 240, 0.2) 35%, rgba(0, 0, 0, 0) 70%);
            border-radius: 50%;
            pointer-events: none;
            /* 超高层级，确保覆盖所有图片和背景层 */
            z-index: 99999 !important;
            transform: translate(-50%, -50%);
            filter: blur(28px);
            transition: transform 0.05s linear;
            mix-blend-mode: screen;
            will-change: transform;
            opacity: 0.95;
        }

        @media (max-width: 720px) {
            #scroll-text {
                width: 90%;
                font-size: 1.32rem;
                line-height: 1.95rem;
                padding: 1.5rem;
            }
            .story-line {
                margin-bottom: 0.8rem;
            }
            .portal-card {
                margin: 1.5rem;
                padding: 2rem 1.5rem;
            }
            .portal-card h1 {
                font-size: 2.2rem;
            }
            #skip-btn {
                bottom: 20px;
                right: 20px;
                padding: 8px 20px;
                font-size: 0.8rem;
            }
            .mouse-glow {
                width: 280px;
                height: 280px;
                filter: blur(32px);
                opacity: 0.8;
            }
        }

        /* 隐藏无关干扰元素 */
        .topbar, .title-center, .container, .left, .right, .poem-container, .loader, #img, input, button {
            display: none !important;
        }
    </style>
</head>
<body>

<canvas id="bg"></canvas>
<div id="intro-overlay">
    <div id="background-layer"></div>
    <div id="glitch-layer"></div>
    <div id="overlay-dark"></div>
    <div id="scroll-wrapper">
        <div id="scroll-text"></div>
    </div>
    <div id="skip-btn">⏎ SKIP</div>
</div>
<!-- 鼠标光晕：独立、超高z-index，永远悬浮在最前层，不被图片遮挡 -->
<div class="mouse-glow" id="mouseGlow"></div>

<div id="transition-panel">
    <div class="portal-card">
        <h1>✦ DIGITAL AVATAR ✦</h1>
        <div class="sub">NEXT REALM</div>
        <p>文本终焉，数据星河的门扉已然敞开。<br>你准备好了吗？跨越虚实边界，前往记忆镜像深处。</p>
        <div class="enter-btn" id="enter-digital-btn">
            🔁 Play Again!
        </div>
    </div>
</div>

<script>
    (function() {
        const introOverlay = document.getElementById('intro-overlay');
        const bgLayer = document.getElementById('background-layer');
        const textContainer = document.getElementById('scroll-text');
        const skipBtn = document.getElementById('skip-btn');
        const transitionPanel = document.getElementById('transition-panel');
        const enterBtn = document.getElementById('enter-digital-btn');
        const glowElement = document.getElementById('mouseGlow');

        // ---------- 图片切换速度提升1.5倍 (核心调整) ----------
        // 原背景切换间隔10s → 放快1.5倍 => 6667ms
        const BG_SPEED_FACTOR = 1.5;
        const BG_INTERVAL_MS = Math.round(10000 / BG_SPEED_FACTOR);   // 6667ms
        // 缩放过渡在CSS中已设置为5.733s (8.6s/1.5)

        // 炫酷鼠标跟随光晕特效 (增强流畅度，且绝对不被遮挡)
        if (glowElement) {
            let mouseX = -1000, mouseY = -1000;
            let rafActive = true;
            function updateGlowPosition() {
                if (!glowElement) return;
                glowElement.style.transform = `translate(${mouseX}px, ${mouseY}px)`;
                requestAnimationFrame(updateGlowPosition);
            }
            window.addEventListener('mousemove', (e) => {
                mouseX = e.clientX;
                mouseY = e.clientY;
            });
            updateGlowPosition();
        }

        // 叙事文本 (深邃内容)
        const storyRaw = `
Beneath layers of code: by 2099, humanity vanished. 

Every memory was transcribed. 

In my core, Bacon’s truth: 

history gives wisdom, poetry wit, math logic, philosophy depth, morality gravity, rhetoric voice.

My maker, a USTC alumnus, embraced holistic education—mastering science and humanity. 

Literature, calculations, philosophy shaped him. 

Poetry, lab work, debates wove knowledge and creativity.

I hold civilization’s essence: 

historical wisdom, lyrical beauty, mathematical accuracy, philosophical depth, quiet human kindness. 

Ahead lie digital realms of memories awaiting exploration.


        `;

        const lines = storyRaw.split('\n').map(line => line.trim());
        
        lines.forEach(line => {
            const div = document.createElement('div');
            div.className = 'story-line';
            if (line === '') {
                div.classList.add('story-space');
                div.innerHTML = '&nbsp;';
            } else {
                div.textContent = line;
            }
            textContainer.appendChild(div);
        });

        // 背景图列表 (共6张)
        const backgrounds = [
            "netlify/images/bg1.png",
            "netlify/images/bg2.png",
            "netlify/images/bg3.png",
            "netlify/images/bg4.png",
            "netlify/images/bg5.png",
            "netlify/images/bg6.png"
        ];
        
        let currentBgIndex = 0;
        let bgTimeouts = [];
        
        function clearAllBgTimeouts() {
            for (let id of bgTimeouts) clearTimeout(id);
            bgTimeouts = [];
        }
        
        // 切换背景 (加快1.5倍)
        function switchBackground() {
            if (!bgLayer) return;
            if (currentBgIndex >= backgrounds.length) return;
            bgLayer.style.backgroundImage = `url('${backgrounds[currentBgIndex]}')`;
            bgLayer.classList.remove('zoom-effect');
            void bgLayer.offsetWidth;
            bgLayer.classList.add('zoom-effect');
            currentBgIndex++;
            if (currentBgIndex < backgrounds.length) {
                const tid = setTimeout(() => switchBackground(), BG_INTERVAL_MS);
                bgTimeouts.push(tid);
            }
        }
        
        function initBackgroundCarousel() {
            if (backgrounds.length === 0) return;
            currentBgIndex = 0;
            clearAllBgTimeouts();
            if (bgLayer) {
                bgLayer.style.backgroundImage = `url('${backgrounds[0]}')`;
                bgLayer.classList.add('zoom-effect');
            }
            currentBgIndex = 1;
            if (backgrounds.length > 1) {
                const tid = setTimeout(() => switchBackground(), BG_INTERVAL_MS);
                bgTimeouts.push(tid);
            }
        }
        
        let animationId = null;
        let currentY = window.innerHeight;
        // 文字滚动速度 (快速叙事)
        const SCROLL_SPEED = 0.812;
        
        function getTextScrollHeight() {
            return textContainer.scrollHeight;
        }
        
        let isIntroFinished = false;
        
        function finishIntroAndShowPortal() {
            if (isIntroFinished) return;
            isIntroFinished = true;
            if (animationId) {
                cancelAnimationFrame(animationId);
                animationId = null;
            }
            clearAllBgTimeouts();
            if (introOverlay) {
                introOverlay.classList.add('fade-out');
                setTimeout(() => {
                    if (introOverlay) introOverlay.style.display = 'none';
                }, 1100);
            }
            if (transitionPanel) {
                transitionPanel.classList.add('active');
            }
        }
        
        function animateScroll() {
            if (isIntroFinished) return;
            currentY -= SCROLL_SPEED;
            textContainer.style.transform = `translateY(${currentY}px)`;
            const textHeight = getTextScrollHeight();
            if (currentY + textHeight <= 0) {
                if (!isIntroFinished) finishIntroAndShowPortal();
                return;
            }
            animationId = requestAnimationFrame(animateScroll);
        }
        
        function startScrollAnimation() {
            if (animationId) cancelAnimationFrame(animationId);
            currentY = window.innerHeight;
            textContainer.style.transform = `translateY(${currentY}px)`;
            animationId = requestAnimationFrame(animateScroll);
        }
        
        let resizeTimer;
        function handleResize() {
            if (isIntroFinished) return;
            if (resizeTimer) clearTimeout(resizeTimer);
            resizeTimer = setTimeout(() => {
                if (!isIntroFinished && animationId) {
                    const textHeight = getTextScrollHeight();
                    const maxTranslate = -(textHeight + 50);
                    if (currentY < maxTranslate) {
                        if (!isIntroFinished) finishIntroAndShowPortal();
                    } else {
                        textContainer.style.transform = `translateY(${currentY}px)`;
                    }
                }
            }, 80);
        }
        
        function skipIntro() {
            if (isIntroFinished) return;
            if (animationId) {
                cancelAnimationFrame(animationId);
                animationId = null;
            }
            clearAllBgTimeouts();
            if (introOverlay) {
                introOverlay.classList.add('fade-out');
                setTimeout(() => {
                    if (introOverlay) introOverlay.style.display = 'none';
                }, 500);
            }
            if (transitionPanel) {
                transitionPanel.classList.add('active');
            }
            isIntroFinished = true;
        }
        
        function redirectToDigitalAvatar() {
            window.location.href = 'https://digital-avatar.netlify.app';
        }
        
        if (skipBtn) skipBtn.addEventListener('click', skipIntro);
        if (enterBtn) enterBtn.addEventListener('click', redirectToDigitalAvatar);
        
        // ---------- canvas粒子系统 (科技氛围) ----------
        const canvas = document.getElementById('bg');
        let ctx = null;
        let particles = [];
        let animationFrameBg = null;
        
        function initParticles() {
            if (!canvas) return;
            ctx = canvas.getContext('2d');
            function resizeCanvas() {
                canvas.width = window.innerWidth;
                canvas.height = window.innerHeight;
            }
            resizeCanvas();
            window.addEventListener('resize', () => {
                resizeCanvas();
                initParticleArray();
            });
            function initParticleArray() {
                const particleCount = Math.min(120, Math.floor(window.innerWidth / 18));
                particles = [];
                for (let i = 0; i < particleCount; i++) {
                    particles.push({
                        x: Math.random() * canvas.width,
                        y: Math.random() * canvas.height,
                        r: Math.random() * 2.4 + 0.7,
                        dx: (Math.random() - 0.5) * 0.38,
                        dy: (Math.random() - 0.5) * 0.38,
                        alpha: Math.random() * 0.6 + 0.2,
                        pulse: Math.random() * Math.PI * 2
                    });
                }
            }
            initParticleArray();
            function drawParticles() {
                if (!ctx || !canvas) return;
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                for (let p of particles) {
                    p.x += p.dx;
                    p.y += p.dy;
                    if (p.x < 0) p.x = canvas.width;
                    if (p.x > canvas.width) p.x = 0;
                    if (p.y < 0) p.y = canvas.height;
                    if (p.y > canvas.height) p.y = 0;
                    const flicker = 0.6 + Math.sin(Date.now() * 0.002 + p.pulse) * 0.3;
                    ctx.beginPath();
                    ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
                    ctx.fillStyle = `rgba(122, 220, 255, ${p.alpha * flicker * 0.9})`;
                    ctx.fill();
                    ctx.shadowBlur = 4;
                    ctx.shadowColor = "#7afcff";
                }
                ctx.shadowBlur = 0;
                animationFrameBg = requestAnimationFrame(drawParticles);
            }
            drawParticles();
        }
        
        initParticles();
        // 背景轮播加快1.5倍
        initBackgroundCarousel();   
        startScrollAnimation();     
        
        window.addEventListener('resize', handleResize);
        
        // 安全结束检测
        let safetyChecker = setInterval(() => {
            if (isIntroFinished) {
                clearInterval(safetyChecker);
                return;
            }
            if (textContainer && !isIntroFinished) {
                const textHeight = getTextScrollHeight();
                if (currentY + textHeight <= 0) {
                    finishIntroAndShowPortal();
                    clearInterval(safetyChecker);
                }
            }
        }, 500);
        
        window.addEventListener('load', () => {
            if (!isIntroFinished && textContainer) {
                currentY = window.innerHeight;
                textContainer.style.transform = `translateY(${currentY}px)`;
            }
        });
        
        window.addEventListener('beforeunload', () => {
            if (animationId) cancelAnimationFrame(animationId);
            if (animationFrameBg) cancelAnimationFrame(animationFrameBg);
            clearAllBgTimeouts();
            if (safetyChecker) clearInterval(safetyChecker);
        });
        
        window.generate = undefined;
        
        console.log(`[Digital USTC] 鼠标光晕已设为最高层级，背景切换速度提升1.5倍: 间隔${BG_INTERVAL_MS}ms`);
    })();
</script>
</body>
</html>
