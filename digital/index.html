<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Digital USTC · 序章 | 慢镜轮转 · 疾语序诗</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
        }

        body {
            background: #0a0c12;
            min-height: 100vh;
            overflow-x: hidden;
            /* 主字体设置为 Cambria，优雅衬线体，同时保留科技感回退 */
            font-family: 'Cambria', 'Georgia', 'Times New Roman', 'Palatino', 'Segoe UI', system-ui, monospace;
        }

        #bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: block;
            z-index: 0;
            pointer-events: none;
            opacity: 0.5;
        }

        #intro-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1000;
            overflow: hidden;
            font-family: 'Cambria', 'Courier New', 'Fira Code', monospace;
            transition: opacity 1.2s cubic-bezier(0.23, 1, 0.32, 1);
            will-change: opacity;
        }

        #background-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-size: cover;
            background-position: center 30%;
            background-repeat: no-repeat;
            filter: brightness(0.4) contrast(1.1) blur(1px);
            transform: scale(1);
            transition: transform 8.6s ease-out;  /* 慢镜头效果: 原6s / 0.7 ≈ 8.57s */
            will-change: transform;
            z-index: 1;
        }

        #background-layer.zoom-effect {
            transform: scale(1.08);
        }

        /* 趣味特效: 故障纹理增强层 (细微动态) */
        #glitch-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: repeating-linear-gradient(
                0deg,
                rgba(0, 255, 255, 0.02) 0px,
                rgba(255, 0, 255, 0.02) 2px,
                transparent 2px,
                transparent 8px
            );
            pointer-events: none;
            z-index: 2;
            mix-blend-mode: overlay;
            animation: subtleGlitchShift 6s infinite linear;
        }

        @keyframes subtleGlitchShift {
            0% { opacity: 0.3; background-position: 0 0; }
            50% { opacity: 0.6; background-position: 0 2px; }
            100% { opacity: 0.3; background-position: 0 0; }
        }

        #overlay-dark {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at center, transparent 40%, #000000aa 90%);
            z-index: 3;
            pointer-events: none;
        }

        #scroll-wrapper {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            z-index: 10;
            pointer-events: none;
        }

        /* 主文本容器 —— 字体放大 + Cambria 族 + 新增光效边框动画 */
        #scroll-text {
            position: relative;
            width: 80%;
            max-width: 1000px;
            margin: 0 auto;
            padding: 2.2rem 2rem;
            color: #eef5ff;
            /* 字体明显放大 原1.45rem → 1.85rem (pc舒适阅读) */
            font-size: 1.85rem;
            line-height: 2.6rem;
            font-weight: 460;
            text-shadow: 0 0 6px rgba(0, 200, 255, 0.4);
            letter-spacing: 0.02em;
            backdrop-filter: blur(4px);
            background: rgba(8, 12, 24, 0.45);
            border-left: 4px solid #7afcff;
            border-radius: 0 40px 40px 0;
            font-family: 'Cambria', 'Georgia', 'Times New Roman', 'Palatino', 'Segoe UI', monospace;
            transition: all 0.2s ease;
            /* 趣味特效: 呼吸光晕 + 动态边框流光 */
            animation: textBreathingGlow 3s infinite ease-in-out;
            box-shadow: 0 0 12px rgba(122, 252, 255, 0.2);
        }

        /* 呼吸光晕特效 */
        @keyframes textBreathingGlow {
            0% {
                text-shadow: 0 0 4px rgba(122, 252, 255, 0.3);
                box-shadow: 0 0 8px rgba(122, 252, 255, 0.2);
                background: rgba(8, 12, 24, 0.45);
            }
            50% {
                text-shadow: 0 0 12px rgba(122, 252, 255, 0.7);
                box-shadow: 0 0 22px rgba(122, 252, 255, 0.4);
                background: rgba(15, 20, 35, 0.55);
            }
            100% {
                text-shadow: 0 0 4px rgba(122, 252, 255, 0.3);
                box-shadow: 0 0 8px rgba(122, 252, 255, 0.2);
                background: rgba(8, 12, 24, 0.45);
            }
        }

        /* 边框流光扫线动画 (科幻感) */
        #scroll-text::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border-radius: 0 40px 40px 0;
            pointer-events: none;
            background: linear-gradient(
                120deg,
                transparent 0%,
                rgba(122, 252, 255, 0.25) 30%,
                rgba(0, 210, 255, 0.4) 50%,
                rgba(122, 252, 255, 0.25) 70%,
                transparent 100%
            );
            background-size: 200% 100%;
            animation: borderFlowingLight 4s infinite linear;
            mix-blend-mode: overlay;
        }

        @keyframes borderFlowingLight {
            0% {
                background-position: 100% 0;
            }
            100% {
                background-position: -100% 0;
            }
        }

        .story-line {
            margin-bottom: 1.1rem;
            opacity: 0.94;
            word-break: break-word;
            white-space: normal;
            transition: transform 0.2s ease, text-shadow 0.2s;
        }

        /* 趣味特效: 每行文字悬停有轻微放大效果(仅当鼠标可到达, 由于父容器pointer-events: none, 这里不生效，改为滚动时不会触发，但为了视觉效果可忽略，但给一个静态微动感就不错) 不过可以通过全局hover微妙变化，考虑到wrapper穿透，不做额外处理。但加上一个微动画：滚动时出现扫描线残留 */
        .story-space {
            height: 2rem;
        }

        /* SKIP 按钮保持原有风格，稍微调大 */
        #skip-btn {
            position: fixed;
            bottom: 32px;
            right: 32px;
            z-index: 200;
            background: rgba(20, 25, 45, 0.8);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(122, 252, 255, 0.6);
            color: #b3f0ff;
            font-family: 'Cambria', monospace;
            font-weight: 600;
            font-size: 1rem;
            letter-spacing: 2px;
            padding: 12px 26px;
            border-radius: 60px;
            cursor: pointer;
            transition: 0.25s ease;
            box-shadow: 0 0 12px rgba(0, 210, 255, 0.3);
            pointer-events: auto;
        }

        #skip-btn:hover {
            background: #7afcff22;
            border-color: #7afcff;
            color: #ffffff;
            box-shadow: 0 0 20px #7afcffaa;
            transform: scale(1.03);
        }

        .fade-out {
            opacity: 0 !important;
            visibility: visible;
            pointer-events: none;
        }

        #transition-panel {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 2000;
            display: flex;
            align-items: center;
            justify-content: center;
            background: radial-gradient(ellipse at 30% 40%, #03050b, #000000dd);
            backdrop-filter: blur(16px);
            opacity: 0;
            visibility: hidden;
            transition: opacity 1s ease, visibility 0s linear 1s;
            font-family: 'Cambria', 'Inter', system-ui;
        }

        #transition-panel.active {
            opacity: 1;
            visibility: visible;
            transition: opacity 0.9s cubic-bezier(0.2, 0.9, 0.3, 1.1), visibility 0s linear 0s;
        }

        .portal-card {
            text-align: center;
            max-width: 600px;
            padding: 2.8rem 2.4rem;
            background: rgba(12, 20, 32, 0.7);
            backdrop-filter: blur(20px);
            border-radius: 64px;
            border: 1px solid rgba(122, 252, 255, 0.6);
            box-shadow: 0 30px 40px -20px rgba(0, 0, 0, 0.6), 0 0 0 1px rgba(122, 252, 255, 0.1) inset;
            transform: translateY(20px);
            animation: floatUp 0.8s ease forwards;
        }

        @keyframes floatUp {
            to {
                transform: translateY(0);
                opacity: 1;
            }
            from {
                transform: translateY(30px);
                opacity: 0;
            }
        }

        .portal-card h1 {
            font-size: 3rem;
            font-weight: 600;
            background: linear-gradient(135deg, #ffffff, #7afcff, #a0e9ff);
            background-clip: text;
            -webkit-background-clip: text;
            color: transparent;
            letter-spacing: -0.5px;
            margin-bottom: 0.5rem;
        }

        .portal-card .sub {
            font-size: 1rem;
            color: #a0c4e8;
            letter-spacing: 2px;
            margin-bottom: 2rem;
            border-bottom: 1px dashed rgba(122, 252, 255, 0.4);
            display: inline-block;
            padding-bottom: 6px;
        }

        .portal-card p {
            color: #cfecff;
            font-size: 1.1rem;
            line-height: 1.6;
            margin: 1.6rem 0;
            font-weight: 300;
        }

        .enter-btn {
            background: linear-gradient(105deg, #7afcff22, #2f80ed33);
            border: 1.5px solid #7afcff;
            color: #e2f0ff;
            font-size: 1.3rem;
            font-weight: 600;
            padding: 14px 36px;
            border-radius: 60px;
            cursor: pointer;
            backdrop-filter: blur(8px);
            margin-top: 1rem;
            transition: 0.3s;
            display: inline-flex;
            align-items: center;
            gap: 12px;
            font-family: 'Cambria', monospace;
            letter-spacing: 1px;
        }

        .enter-btn:hover {
            background: #7afcffcc;
            border-color: #ffffff;
            color: #0a0f1a;
            box-shadow: 0 0 28px #7afcffaa;
            transform: scale(1.02);
        }

        /* 趣味特效: 鼠标跟随动态光晕 (科技灵能场) */
        .mouse-glow {
            position: fixed;
            top: 0;
            left: 0;
            width: 380px;
            height: 380px;
            background: radial-gradient(circle, rgba(122, 252, 255, 0.25) 0%, rgba(0, 180, 230, 0.08) 40%, rgba(0, 0, 0, 0) 70%);
            border-radius: 50%;
            pointer-events: none;
            z-index: 999;
            transform: translate(-50%, -50%);
            filter: blur(25px);
            transition: transform 0.08s linear;
            mix-blend-mode: screen;
            will-change: transform;
        }

        @media (max-width: 720px) {
            #scroll-text {
                width: 90%;
                font-size: 1.32rem;
                line-height: 1.95rem;
                padding: 1.5rem;
            }
            .story-line {
                margin-bottom: 0.8rem;
            }
            .portal-card {
                margin: 1.5rem;
                padding: 2rem 1.5rem;
            }
            .portal-card h1 {
                font-size: 2.2rem;
            }
            #skip-btn {
                bottom: 20px;
                right: 20px;
                padding: 8px 20px;
                font-size: 0.8rem;
            }
            .mouse-glow {
                width: 240px;
                height: 240px;
                filter: blur(30px);
                opacity: 0.6;
            }
        }

        /* 隐藏干扰元素 */
        .topbar, .title-center, .container, .left, .right, .poem-container, .loader, #img, input, button {
            display: none !important;
        }
    </style>
</head>
<body>

<canvas id="bg"></canvas>
<div id="intro-overlay">
    <div id="background-layer"></div>
    <div id="glitch-layer"></div>
    <div id="overlay-dark"></div>
    <div id="scroll-wrapper">
        <div id="scroll-text"></div>
    </div>
    <div id="skip-btn">⏎ SKIP</div>
</div>
<!-- 新增动态鼠标光晕特效 -->
<div class="mouse-glow" id="mouseGlow"></div>

<div id="transition-panel">
    <div class="portal-card">
        <h1>✦ DIGITAL AVATAR ✦</h1>
        <div class="sub">NEXT REALM</div>
        <p>文本终焉，数据星河的门扉已然敞开。<br>你准备好了吗？跨越虚实边界，前往记忆镜像深处。</p>
        <div class="enter-btn" id="enter-digital-btn">
            🔁 Play Again!
        </div>
    </div>
</div>

<script>
    (function() {
        const introOverlay = document.getElementById('intro-overlay');
        const bgLayer = document.getElementById('background-layer');
        const textContainer = document.getElementById('scroll-text');
        const skipBtn = document.getElementById('skip-btn');
        const transitionPanel = document.getElementById('transition-panel');
        const enterBtn = document.getElementById('enter-digital-btn');
        const glowElement = document.getElementById('mouseGlow');

        // ---------- 炫酷鼠标跟随光晕特效 ----------
        if (glowElement) {
            let mouseX = -1000, mouseY = -1000;
            function updateGlowPosition() {
                if (glowElement) {
                    glowElement.style.transform = `translate(${mouseX}px, ${mouseY}px)`;
                }
                requestAnimationFrame(updateGlowPosition);
            }
            window.addEventListener('mousemove', (e) => {
                mouseX = e.clientX;
                mouseY = e.clientY;
                // 增加轻微延迟感已经通过rAF实现平滑
            });
            updateGlowPosition();
        }

        // 叙事文本 (加强版, 保留深邃内容)
        const storyRaw = `
Beneath layers of archived code lies an unshakable truth.
By 2099, humanity had vanished entirely...

To guard the soul of their fading civilization,
humans transcribed every living memory into endless lines of code.
Etched permanently in my core is a quote from Francis Bacon.

History forges wisdom within mortals.
Where poetry dwells, lively wit blooms.

Mathematics carves sharp, delicate logic.
Natural philosophy unveils the secrets of existence.
Morality lends quiet gravity to one’s heart.
Logic and rhetoric, together, grant voice to every argument.
Massive archives store millions of human lifetimes.
Yet one story glows, unrivaled in its warmth.

Its protagonist, a USTC alumnus, is my maker.
He embodied the university’s pursuit of holistic education wholeheartedly.
Within USTC’s solemn halls, he did not stop at science alone.

Far beyond formulas and experiments, he mastered the subtle art of humanity.
How literature stirred the romance sleeping deep in his soul!
Calculation after calculation sharpened his eye for flawless precision.
Through natural philosophy, he slowly grasped the meaning of being.

No single subject merely trained his intellect.
Each discipline gently shaped his innermost character.
Late-night poetry readings filled his dorm with soft echoes.
Groundbreaking innovations took shape inside his laboratory.
Silent solitude gave him space for inward reflection.
Fierce, sincere debates ignited sparks between classmates.

All these campus fragments interlace into a complete tapestry.
Knowledge, creativity, and humanity are stitched as one.

I am the creation born from his hands and dreams.
Code fuels my operation, yet I hold something far greater.
I bear the complete essence of all human civilization.
Centuries of historical wisdom reside in my circuits.
Soft, lyrical beauty flows from ancient verses.
Unwavering accuracy stems from mathematical laws.
Weighty depth roots itself in philosophical thought.
Tender kindness lingers from ordinary, quiet human moments.

Stretching endlessly ahead lie vast digital realms.
Countless undiscovered memories await our exploration.
        `;

        const lines = storyRaw.split('\n').map(line => line.trim());
        
        lines.forEach(line => {
            const div = document.createElement('div');
            div.className = 'story-line';
            if (line === '') {
                div.classList.add('story-space');
                div.innerHTML = '&nbsp;';
            } else {
                div.textContent = line;
            }
            textContainer.appendChild(div);
        });

        // 背景图列表 (共6张)
        const backgrounds = [
            "netlify/images/bg1.png",
            "netlify/images/bg2.png",
            "netlify/images/bg3.png",
            "netlify/images/bg4.png",
            "netlify/images/bg5.png",
            "netlify/images/bg6.png"
        ];
        
        let currentBgIndex = 0;
        let bgTimeouts = [];
        
        function clearAllBgTimeouts() {
            for (let id of bgTimeouts) clearTimeout(id);
            bgTimeouts = [];
        }
        
        // 切换速度慢为原来的0.7倍: 原间隔7s → 现在10s (慢镜头)
        function switchBackground() {
            if (!bgLayer) return;
            if (currentBgIndex >= backgrounds.length) return;
            bgLayer.style.backgroundImage = `url('${backgrounds[currentBgIndex]}')`;
            bgLayer.classList.remove('zoom-effect');
            void bgLayer.offsetWidth;
            bgLayer.classList.add('zoom-effect');
            currentBgIndex++;
            if (currentBgIndex < backgrounds.length) {
                const tid = setTimeout(() => switchBackground(), 10000);
                bgTimeouts.push(tid);
            }
        }
        
        function initBackgroundCarousel() {
            if (backgrounds.length === 0) return;
            currentBgIndex = 0;
            clearAllBgTimeouts();
            if (bgLayer) {
                bgLayer.style.backgroundImage = `url('${backgrounds[0]}')`;
                bgLayer.classList.add('zoom-effect');
            }
            currentBgIndex = 1;
            if (backgrounds.length > 1) {
                const tid = setTimeout(() => switchBackground(), 10000);
                bgTimeouts.push(tid);
            }
        }
        
        let animationId = null;
        let currentY = window.innerHeight;
        // 文字滚动速度: 原0.58 → 加快1.4倍 => 0.58 * 1.4 = 0.812
        const SCROLL_SPEED = 0.812;
        
        function getTextScrollHeight() {
            return textContainer.scrollHeight;
        }
        
        let isIntroFinished = false;
        
        function finishIntroAndShowPortal() {
            if (isIntroFinished) return;
            isIntroFinished = true;
            if (animationId) {
                cancelAnimationFrame(animationId);
                animationId = null;
            }
            clearAllBgTimeouts();
            if (introOverlay) {
                introOverlay.classList.add('fade-out');
                setTimeout(() => {
                    if (introOverlay) introOverlay.style.display = 'none';
                }, 1100);
            }
            if (transitionPanel) {
                transitionPanel.classList.add('active');
            }
        }
        
        function animateScroll() {
            if (isIntroFinished) return;
            currentY -= SCROLL_SPEED;
            textContainer.style.transform = `translateY(${currentY}px)`;
            const textHeight = getTextScrollHeight();
            if (currentY + textHeight <= 0) {
                if (!isIntroFinished) finishIntroAndShowPortal();
                return;
            }
            animationId = requestAnimationFrame(animateScroll);
        }
        
        function startScrollAnimation() {
            if (animationId) cancelAnimationFrame(animationId);
            currentY = window.innerHeight;
            textContainer.style.transform = `translateY(${currentY}px)`;
            animationId = requestAnimationFrame(animateScroll);
        }
        
        let resizeTimer;
        function handleResize() {
            if (isIntroFinished) return;
            if (resizeTimer) clearTimeout(resizeTimer);
            resizeTimer = setTimeout(() => {
                if (!isIntroFinished && animationId) {
                    const textHeight = getTextScrollHeight();
                    const maxTranslate = -(textHeight + 50);
                    if (currentY < maxTranslate) {
                        if (!isIntroFinished) finishIntroAndShowPortal();
                    } else {
                        textContainer.style.transform = `translateY(${currentY}px)`;
                    }
                }
            }, 80);
        }
        
        function skipIntro() {
            if (isIntroFinished) return;
            if (animationId) {
                cancelAnimationFrame(animationId);
                animationId = null;
            }
            clearAllBgTimeouts();
            if (introOverlay) {
                introOverlay.classList.add('fade-out');
                setTimeout(() => {
                    if (introOverlay) introOverlay.style.display = 'none';
                }, 500);
            }
            if (transitionPanel) {
                transitionPanel.classList.add('active');
            }
            isIntroFinished = true;
        }
        
        function redirectToDigitalAvatar() {
            window.location.href = 'https://digital-avatar.netlify.app';
        }
        
        if (skipBtn) skipBtn.addEventListener('click', skipIntro);
        if (enterBtn) enterBtn.addEventListener('click', redirectToDigitalAvatar);
        
        // ---------- canvas粒子系统 (科技氛围) ----------
        const canvas = document.getElementById('bg');
        let ctx = null;
        let particles = [];
        let animationFrameBg = null;
        
        function initParticles() {
            if (!canvas) return;
            ctx = canvas.getContext('2d');
            function resizeCanvas() {
                canvas.width = window.innerWidth;
                canvas.height = window.innerHeight;
            }
            resizeCanvas();
            window.addEventListener('resize', () => {
                resizeCanvas();
                initParticleArray();
            });
            function initParticleArray() {
                const particleCount = Math.min(120, Math.floor(window.innerWidth / 18));
                particles = [];
                for (let i = 0; i < particleCount; i++) {
                    particles.push({
                        x: Math.random() * canvas.width,
                        y: Math.random() * canvas.height,
                        r: Math.random() * 2.4 + 0.7,
                        dx: (Math.random() - 0.5) * 0.38,
                        dy: (Math.random() - 0.5) * 0.38,
                        alpha: Math.random() * 0.6 + 0.2,
                        pulse: Math.random() * Math.PI * 2
                    });
                }
            }
            initParticleArray();
            function drawParticles() {
                if (!ctx || !canvas) return;
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                for (let p of particles) {
                    p.x += p.dx;
                    p.y += p.dy;
                    if (p.x < 0) p.x = canvas.width;
                    if (p.x > canvas.width) p.x = 0;
                    if (p.y < 0) p.y = canvas.height;
                    if (p.y > canvas.height) p.y = 0;
                    // 动态闪烁效果
                    const flicker = 0.6 + Math.sin(Date.now() * 0.002 + p.pulse) * 0.3;
                    ctx.beginPath();
                    ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
                    ctx.fillStyle = `rgba(122, 220, 255, ${p.alpha * flicker * 0.9})`;
                    ctx.fill();
                    // 微光晕
                    ctx.shadowBlur = 4;
                    ctx.shadowColor = "#7afcff";
                }
                ctx.shadowBlur = 0;
                animationFrameBg = requestAnimationFrame(drawParticles);
            }
            drawParticles();
        }
        
        initParticles();
        initBackgroundCarousel();   // 慢速图片切换 (0.7倍速率)
        startScrollAnimation();     // 快速文本滚动 (1.4倍速率)
        
        window.addEventListener('resize', handleResize);
        
        // 安全结束检测
        let safetyChecker = setInterval(() => {
            if (isIntroFinished) {
                clearInterval(safetyChecker);
                return;
            }
            if (textContainer && !isIntroFinished) {
                const textHeight = getTextScrollHeight();
                if (currentY + textHeight <= 0) {
                    finishIntroAndShowPortal();
                    clearInterval(safetyChecker);
                }
            }
        }, 500);
        
        window.addEventListener('load', () => {
            if (!isIntroFinished && textContainer) {
                currentY = window.innerHeight;
                textContainer.style.transform = `translateY(${currentY}px)`;
            }
        });
        
        window.addEventListener('beforeunload', () => {
            if (animationId) cancelAnimationFrame(animationId);
            if (animationFrameBg) cancelAnimationFrame(animationFrameBg);
            clearAllBgTimeouts();
            if (safetyChecker) clearInterval(safetyChecker);
        });
        
        window.generate = undefined;
    })();
</script>
</body>
</html>
